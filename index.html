:root{
  --bg:#f6f8fc; --surface:#ffffff; --ink:#262b40; --ink-2:#585f7e; --line:#e1e6f2;
  --sky:#d6eaf8; --sky-ink:#1f4e79;
  --lav:#e3ddf6; --lav-ink:#43377d;
  --mint:#d5f0e4; --mint-ink:#1d5a43;
  --peach:#fde3d3; --peach-ink:#7a3d1c;
  --rose:#f9dce7; --rose-ink:#7d2a4a;
  --accent:#5b6fd6; --on-accent:#ffffff; --road:#d9dff0; --lane:#ffffff;
  --display:'Bricolage Grotesque','DM Sans',system-ui,sans-serif;
  --body:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14172a; --surface:#1d2138; --ink:#e8eaf6; --ink-2:#a3a9c9; --line:#2f3556;

    --road:#2a3050; --lane:#3c4570; color-scheme:dark;

}

  --mint:#1f4a3b; --mint-ink:#bfe9d6; --peach:#5a3a2a; --peach-ink:#fbd9c3;
  --rose:#5a2d41; --rose-ink:#f8cfe0; --accent:#9aa8ff; --on-accent:#14172a;
  --road:#2a3050; --lane:#3c4570; color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 var(--body);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--display);line-height:1.15;margin:0;font-weight:700;text-wrap:balance}
p{margin:0}
a{color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
.wrap{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.tone-sky{--t:var(--sky);--ti:var(--sky-ink)}
.tone-lav{--t:var(--lav);--ti:var(--lav-ink)}
.tone-mint{--t:var(--mint);--ti:var(--mint-ink)}
.tone-peach{--t:var(--peach);--ti:var(--peach-ink)}
.tone-rose{--t:var(--rose);--ti:var(--rose-ink)}

.topbar{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:16px;height:56px}
.brand{font:700 17px var(--display);text-decoration:none;background:var(--lav);color:var(--lav-ink);width:36px;height:36px;border-radius:10px;display:grid;place-items:center}
.bar nav{display:flex;gap:4px;margin-left:auto;flex-wrap:nowrap}
.bar nav a{white-space:nowrap}
.bar nav a{font-size:14px;text-decoration:none;color:var(--ink-2);padding:6px 10px;border-radius:8px}
.bar nav a:hover{background:var(--surface);color:var(--ink)}
.theme{white-space:nowrap;font:500 13px var(--body);border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:99px;padding:6px 12px;cursor:pointer}
.theme:hover{border-color:var(--accent)}

.profile{background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden;margin-top:20px}
.cover{height:clamp(120px,22vw,220px);background-color:var(--sky);background-size:cover;background-position:center;
  background-image:radial-gradient(circle at 18% 35%,var(--lav) 0 17%,transparent 17.5%),radial-gradient(circle at 78% 65%,var(--mint) 0 21%,transparent 21.5%),radial-gradient(circle at 56% 22%,var(--peach) 0 9%,transparent 9.5%)}
.cover.has-img{background-image:var(--cover-img)}
.profile-body{padding:0 clamp(16px,3vw,28px) 24px}
.avatar{width:clamp(88px,14vw,132px);aspect-ratio:1;border-radius:50%;border:5px solid var(--surface);margin-top:calc(-1 * clamp(44px,7vw,66px));background:var(--lav);color:var(--lav-ink);display:grid;place-items:center;font:700 clamp(28px,5vw,44px) var(--display);overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.profile h1{font-size:clamp(28px,5vw,40px);margin-top:12px}
.headline{color:var(--ink-2);font-size:18px;margin-top:2px}
.meta{font-family:var(--mono);font-size:13px;color:var(--ink-2);margin-top:4px}
.about{max-width:62ch;margin-top:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.chip{font-size:13px;font-weight:500;padding:4px 12px;border-radius:99px;background:var(--t);color:var(--ti)}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
.btn{display:inline-flex;align-items:center;gap:6px;font:500 15px var(--body);text-decoration:none;padding:10px 18px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}

section.block{margin-top:56px;scroll-margin-top:72px}
.block-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.block-head h2{font-size:clamp(24px,4vw,32px)}
.hint{font-family:var(--mono);font-size:13px;color:var(--ink-2)}
.road{position:relative;margin-top:12px}
.road svg{display:block;position:absolute;inset:0}
.road .node{fill:var(--surface);stroke:var(--line);stroke-width:3;transition:fill .3s,stroke .3s}
.road .node.reached{fill:var(--t);stroke:var(--ti)}
.stop{position:absolute;transform:translateY(-50%);background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:2px;text-decoration:none;color:var(--ink);opacity:.5;transition:opacity .3s,border-color .2s,transform .2s}
.stop.reached{opacity:1}
a.stop:hover{border-color:var(--ti);transform:translateY(calc(-50% - 3px))}
.stop .date{align-self:flex-start;font:500 12px var(--mono);background:var(--t);color:var(--ti);padding:2px 10px;border-radius:99px;margin-bottom:4px}
.stop strong{font:700 17px/1.25 var(--display)}
.stop .sub{font-size:14px;color:var(--ink-2);line-height:1.45}
.stop .go{font-size:13px;font-weight:500;color:var(--ti);margin-top:6px}

.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-top:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.card.todo{border-style:dashed}

.card h3{font-size:18px;margin-top:6px}
.card .small{font-size:14px;color:var(--ink-2)}
.card a{font-size:14px;font-weight:500;color:var(--accent)}

.contact p{max-width:60ch}
.contact .mail{font:500 16px var(--mono);margin-top:10px;user-select:all;word-break:break-all}
footer{margin-top:64px;padding-block:28px;border-top:1px solid var(--line);color:var(--ink-2);font-size:14px}

.back{display:inline-block;margin-top:20px;font-size:15px;font-weight:500;color:var(--ink-2);text-decoration:none}
.back:hover{color:var(--ink)}
.page-head{background:var(--t);color:var(--ti);border-radius:20px;padding:clamp(20px,4vw,36px);margin-top:14px}
.page-head .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pill{font:500 12px var(--mono);background:var(--surface);color:var(--ink);padding:3px 12px;border-radius:99px}
.pill.todo{border:1px dashed var(--ti);background:transparent;color:var(--ti)}
.page-head h1{font-size:clamp(30px,6vw,48px);margin-top:12px}
.lead{max-width:64ch;margin-top:12px;font-size:17px}
.links{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.draft{margin-top:14px;font-size:14px;background:var(--surface);color:var(--ink);border:1px dashed var(--ti);border-radius:12px;padding:8px 12px;max-width:64ch}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:20px}
.metric{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.metric b{display:block;font:700 28px var(--display);color:var(--ti)}
.metric span{font-size:13px;color:var(--ink-2)}
.grid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:28px;align-items:start;margin-top:36px}
.grid h2{font-size:22px}
.flow{list-style:none;margin:14px 0 0;padding:0}
.flow li:not(:last-child)::after{content:"\2193";display:block;text-align:center;color:var(--ink-2);line-height:22px}
.step{width:100%;display:flex;align-items:center;gap:12px;text-align:left;font:500 16px var(--body);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer}
.step:hover{border-color:var(--ti)}
.step .n{flex:none;width:28px;height:28px;border-radius:50%;background:var(--t);color:var(--ti);display:grid;place-items:center;font:700 13px var(--mono)}
.step .name{flex:1;min-width:0}
.step.active{background:var(--t);border-color:var(--ti);color:var(--ti)}
.step.active .n{background:var(--surface)}
.badge{font:500 11px var(--mono);padding:2px 8px;border-radius:99px;background:var(--bg);color:var(--ink-2);border:1px solid var(--line)}
.badge.built{background:var(--mint);color:var(--mint-ink);border-color:transparent}
.side{display:flex;flex-direction:column;gap:16px;position:sticky;top:76px}
.detail{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 20px}
.detail .count{font:500 12px var(--mono);color:var(--ink-2)}
.detail h3{font-size:20px;margin-top:4px}
.detail p{margin-top:8px}
.detail ul{margin:10px 0 0;padding-left:20px;color:var(--ink-2)}
.detail li+li{margin-top:4px}
.stack{background:var(--t);color:var(--ti);border-radius:16px;padding:18px 20px}
.stack h3{font-size:18px}
.stack .chips{margin-top:12px}
.stack .chip{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.pn{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:48px}
.pn a{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;text-decoration:none;display:flex;flex-direction:column;gap:2px;min-width:0}
.pn a:hover{border-color:var(--accent)}
.pn small{font:500 12px var(--mono);color:var(--ink-2)}
.pn .next{text-align:right}
@media (max-width:820px){
  .grid{grid-template-columns:minmax(0,1fr)}
  .side{position:static}
}
@media (max-width:520px){
  .bar nav a{padding:6px 5px;font-size:13px}
  .bar{gap:6px}
  .theme{padding:6px 10px}
}
@media (prefers-reduced-motion: reduce){
  *{transition:none!important}
}

  certs: [
    { type: "Certification", title: "Deep Reinforcement Learning using python 2025", org: "Udemy", year: "2025", url: "assets/certs/AnuhskaSrivastava_DeepReinforcementUdemy.pdf", todo: true },
    { type: "Certification", title: "Python (Basic)", org: "HackerRank", year: "2025", url: "assets/certs/AnushkaSrivastava_python.pdf", todo: true },
    { type: "Certification", title: "CSS Basics", org: "edX:W3Cx", year: "2025", url: "assets\certs\AnushkaSrivastava_WebDev.pdf", todo: true },

const TONES = ["tone-sky", "tone-lav", "tone-mint", "tone-peach", "tone-rose"];
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
const app = document.getElementById("app");
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const ext = u => /^https?:\/\//.test(u) ? ` target="_blank" rel="noopener noreferrer"` : "";
const initials = n => n.split(/\s+/).map(w => w[0]).slice(0, 2).join("").toUpperCase();

/* ---------- theme ---------- */
const themeBtn = $("#themeBtn");
function effectiveTheme() {
  return document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
}
function syncThemeBtn() {
  const dark = effectiveTheme() === "dark";
  themeBtn.textContent = dark ? "Light" : "Dark";
  themeBtn.setAttribute("aria-label", dark ? "Switch to light mode" : "Switch to dark mode");
}
try { const saved = localStorage.getItem("theme"); if (saved) document.documentElement.dataset.theme = saved; } catch (e) {}
themeBtn.addEventListener("click", () => {
  const next = effectiveTheme() === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem("theme", next); } catch (e) {}
  syncThemeBtn();
});
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", syncThemeBtn);
syncThemeBtn();

/* ---------- home ---------- */
function homeView() {
  const p = DATA.profile;
  const chips = p.skills.map((s, i) => `<span class="chip ${TONES[i % TONES.length]}">${esc(s)}</span>`).join("");
  const coverStyle = p.cover ? ` style="--cover-img:url('${esc(p.cover)}')"` : "";
  const avatar = p.photo ? `<img src="${esc(p.photo)}" alt="${esc(p.name)}">` : esc(initials(p.name));
  const resumeBtn = p.resume ? `<a class="btn primary" href="${esc(p.resume)}" target="_blank" rel="noopener">Download resume</a>` : "";
  const stops = DATA.stops.map((s, i) => {
    const inner = `<span class="date">${esc(s.date)}</span><strong>${esc(s.title)}</strong><span class="sub">${esc(s.sub)}</span>${s.page ? `<span class="go">Open page</span>` : ""}`;
    return s.page
      ? `<a class="stop tone-${s.tone}" data-i="${i}" href="#/p/${esc(s.id)}">${inner}</a>`
      : `<div class="stop tone-${s.tone}" data-i="${i}">${inner}</div>`;
  }).join("");
  const certs = DATA.certs.map((c, i) => `
    <div class="card ${TONES[(i + 3) % TONES.length]}${c.todo ? " todo" : ""}">
      <span class="kind">${esc(c.type)}</span>
      <h3>${esc(c.title)}</h3>
      <span class="small">${esc(c.org)}</span>
      <span class="small">${esc(c.year)}</span>
      ${c.url ? `<a href="${esc(c.url)}"${ext(c.url)}>View credential</a>` : ""}
    </div>`).join("");
  const links = [
    p.linkedin && `<a class="btn" href="${esc(p.linkedin)}"${ext(p.linkedin)}>LinkedIn</a>`,
    p.github && `<a class="btn" href="${esc(p.github)}"${ext(p.github)}>GitHub</a>`,
    p.resume && `<a class="btn" href="${esc(p.resume)}" target="_blank" rel="noopener">Resume</a>`
  ].filter(Boolean).join("");
  const contactBody = (p.email || links)
    ? `${p.email ? `<p class="mail">${esc(p.email)}</p>` : ""}${links ? `<div class="actions">${links}</div>` : ""}`
    : `<p class="hint">Add your email and profile links in the DATA block to show them here.</p>`;

  return `
  <section class="profile" aria-label="Profile">
    <div class="cover${p.cover ? " has-img" : ""}"${coverStyle}></div>
    <div class="profile-body">
      <div class="avatar">${avatar}</div>
      <h1>${esc(p.name)}</h1>
      <p class="headline">${esc(p.headline)}</p>
      <p class="meta">${esc(p.location)}</p>
      <p class="about">${esc(p.about)}</p>
      <div class="chips">${chips}</div>
      <div class="actions">${resumeBtn}<a class="btn" href="#/contact">Contact</a></div>
    </div>
  </section>

  <section class="block" id="journey">
    <div class="block-head"><h2>Career road</h2><span class="hint">Scroll to drive. Tap a stop to open it.</span></div>
    <div class="road" id="road"><svg aria-hidden="true"></svg>${stops}</div>
  </section>

  <section class="block" id="certs">
    <div class="block-head"><h2>Certifications and hackathons</h2></div>
    <div class="cards">${certs}</div>
  </section>

  <section class="block" id="contact">
    <div class="block-head"><h2>Contact</h2></div>
    <div class="contact"><p>Open to internships and projects in machine learning, data and LLM tools.</p>${contactBody}</div>
  </section>`;
}

/* ---------- road ---------- */
let road = null;
function initRoad() {
  const el = $("#road");
  if (!el) { road = null; return; }
  road = { el, svg: $("svg", el), cards: [...el.querySelectorAll(".stop")], pts: [], path: null, L: 0, car: null, clip: null, nodes: [] };
  layoutRoad();
  updateRoad();
}
function layoutRoad() {
  if (!road) return;
  const W = road.el.clientWidth, n = DATA.stops.length;
  const mobile = W < 760, top = 70, gap = mobile ? 170 : 200, rw = mobile ? 24 : 38;
  const H = top * 2 + (n - 1) * gap;
  road.el.style.height = H + "px";
  const pts = DATA.stops.map((s, i) => ({ x: mobile ? (i % 2 ? 30 : 62) : W * (i % 2 ? 0.36 : 0.64), y: top + i * gap }));
  let d = `M${pts[0].x} ${pts[0].y}`;
  for (let i = 1; i < n; i++) {
    const a = pts[i - 1], b = pts[i], ym = (a.y + b.y) / 2;
    d += ` C${a.x} ${ym} ${b.x} ${ym} ${b.x} ${b.y}`;
  }
  const nodes = pts.map((p, i) => `<circle class="node tone-${DATA.stops[i].tone}" cx="${p.x}" cy="${p.y}" r="${mobile ? 12 : 15}"/>`).join("");
  road.svg.setAttribute("width", W);
  road.svg.setAttribute("height", H);
  road.svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  road.svg.innerHTML = `
    <defs><clipPath id="roadClip"><rect id="clipRect" x="0" y="0" width="${W}" height="1"/></clipPath></defs>
    <g clip-path="url(#roadClip)">
      <path id="roadPath" d="${d}" fill="none" stroke="var(--road)" stroke-width="${rw}" stroke-linecap="round"/>
      <path d="${d}" fill="none" stroke="var(--lane)" stroke-width="3" stroke-dasharray="10 12"/>
    </g>
    ${nodes}
    <g id="car">
      <rect x="-16" y="-9" width="32" height="18" rx="7" fill="var(--accent)"/>
      <rect x="2" y="-6" width="9" height="12" rx="3" fill="var(--surface)"/>
      <circle cx="-9" cy="-10" r="3.5" fill="var(--ink)"/><circle cx="-9" cy="10" r="3.5" fill="var(--ink)"/>
      <circle cx="8" cy="-10" r="3.5" fill="var(--ink)"/><circle cx="8" cy="10" r="3.5" fill="var(--ink)"/>
    </g>`;
  road.pts = pts;
  road.path = $("#roadPath", road.svg);
  road.L = road.path.getTotalLength();
  road.car = $("#car", road.svg);
  road.clip = $("#clipRect", road.svg);
  road.nodes = [...road.svg.querySelectorAll(".node")];
  road.cards.forEach((c, i) => {
    const p = pts[i];
    c.style.top = p.y + "px";
    if (mobile) {
      c.style.left = "92px"; c.style.width = (W - 92 - 4) + "px";
    } else if (i % 2 === 0) {
      const left = p.x + rw / 2 + 28, w = Math.min(360, W - left - 4);
      c.style.left = left + "px"; c.style.width = w + "px";
    } else {
      const edge = p.x - rw / 2 - 28, w = Math.min(360, edge - 4);
      c.style.left = (edge - w) + "px"; c.style.width = w + "px";
    }
  });
}
function updateRoad() {
  if (!road || !road.path) return;
  const pts = road.pts, last = pts[pts.length - 1].y;
  let y;
  if (reduceMotion) y = last;
  else {
    const r = road.el.getBoundingClientRect();
    y = Math.max(pts[0].y, Math.min(last, innerHeight * 0.55 - r.top));
  }
  let lo = 0, hi = road.L;
  for (let k = 0; k < 22; k++) {
    const mid = (lo + hi) / 2;
    if (road.path.getPointAtLength(mid).y < y) lo = mid; else hi = mid;
  }
  const pt = road.path.getPointAtLength(hi);
  const a = road.path.getPointAtLength(Math.max(0, hi - 3)), b = road.path.getPointAtLength(Math.min(road.L, hi + 3));
  const ang = Math.atan2(b.y - a.y, b.x - a.x) * 180 / Math.PI;
  road.car.setAttribute("transform", `translate(${pt.x} ${pt.y}) rotate(${ang})`);
  road.car.style.display = reduceMotion ? "none" : "";
  road.clip.setAttribute("height", y + 20);
  pts.forEach((p, i) => {
    const on = p.y <= y + 1;
    road.nodes[i].classList.toggle("reached", on);
    road.cards[i].classList.toggle("reached", on);
  });
}
let ticking = false;
addEventListener("scroll", () => {
  if (ticking) return;
  ticking = true;
  requestAnimationFrame(() => { ticking = false; updateRoad(); });
}, { passive: true });
addEventListener("resize", () => { layoutRoad(); updateRoad(); });

/* ---------- detail page ---------- */
function pageView(id) {
  const pg = DATA.pages[id];
  const stop = DATA.stops.find(s => s.id === id);
  const order = DATA.stops.filter(s => s.page);
  const idx = order.findIndex(s => s.id === id);
  const prev = order[idx - 1], next = order[idx + 1];
  const metrics = pg.metrics && pg.metrics.length
    ? `<div class="metrics">${pg.metrics.map(m => `<div class="metric"><b>${esc(m.value)}</b><span>${esc(m.label)}</span></div>`).join("")}</div>` : "";
  const steps = pg.steps.map((s, i) => `
    <li><button class="step${i === 0 ? " active" : ""}" type="button" data-i="${i}" aria-pressed="${i === 0}">
      <span class="n">${i + 1}</span><span class="name">${esc(s.title)}</span>
      ${s.status ? `<span class="badge ${s.status === "Built" ? "built" : ""}">${esc(s.status)}</span>` : ""}
    </button></li>`).join("");
  const links = (pg.links || []).filter(l => l.url).map(l => `<a class="btn" href="${esc(l.url)}"${ext(l.url)}>${esc(l.label)}</a>`).join("");
  const stack = pg.stack.map(t => `<span class="chip">${esc(t)}</span>`).join("");
  return `
  <article class="tone-${stop.tone}">
    <a class="back" href="#/journey">&larr; Back to the road</a>
    <header class="page-head">
      <div class="row"><span class="pill">${esc(pg.kind)}</span><span class="pill${pg.durationTodo ? " todo" : ""}">${esc(pg.duration)}</span>${pg.status ? `<span class="pill">${esc(pg.status)}</span>` : ""}</div>
      <h1>${esc(pg.title)}</h1>
      <p class="lead">${esc(pg.description)}</p>
      ${pg.draft ? `<p class="draft">${esc(pg.draft)}</p>` : ""}
      ${links ? `<div class="links">${links}</div>` : ""}
    </header>
    ${metrics}
    <div class="grid">
      <div>
        <h2>Structure of the project</h2>
        <p class="hint" style="margin-top:6px">Hover or tap a step to read how it works.</p>
        <ol class="flow" id="flow">${steps}</ol>
      </div>
      <div class="side">
        <div class="detail" id="detail" aria-live="polite"></div>
        <div class="stack"><h3>Tech stack</h3><div class="chips">${stack}</div></div>
      </div>
    </div>
    <nav class="pn" aria-label="More pages">
      ${prev ? `<a href="#/p/${esc(prev.id)}"><small>Previous</small><strong>${esc(prev.title)}</strong></a>` : `<span></span>`}
      ${next ? `<a class="next" href="#/p/${esc(next.id)}"><small>Next</small><strong>${esc(next.title)}</strong></a>` : `<span></span>`}
    </nav>
  </article>`;
}
function initPage(id) {
  const pg = DATA.pages[id];
  const detail = $("#detail"), buttons = [...document.querySelectorAll(".step")];
  function setStep(i) {
    const s = pg.steps[i];
    buttons.forEach((b, k) => { b.classList.toggle("active", k === i); b.setAttribute("aria-pressed", k === i); });
    detail.innerHTML = `<span class="count">Step ${i + 1} of ${pg.steps.length}${s.status ? " &middot; " + esc(s.status) : ""}</span>
      <h3>${esc(s.title)}</h3><p>${esc(s.text)}</p>
      ${s.points ? `<ul>${s.points.map(p => `<li>${esc(p)}</li>`).join("")}</ul>` : ""}`;
  }
  const canHover = matchMedia("(hover: hover)").matches;
  buttons.forEach((b, i) => {
    b.addEventListener("click", () => setStep(i));
    b.addEventListener("focus", () => setStep(i));
    if (canHover) b.addEventListener("mouseenter", () => setStep(i));
  });
  setStep(0);
}

/* ---------- routing ---------- */
let view = "";
function route() {
  const h = location.hash.replace(/^#\/?/, "");
  const m = h.match(/^p\/(.+)$/);
  if (m && DATA.pages[m[1]]) {
    view = "page"; road = null;
    app.innerHTML = pageView(m[1]);
    initPage(m[1]);
    document.title = DATA.pages[m[1]].title + " | " + DATA.profile.name;
    scrollTo(0, 0);
    return;
  }
  document.title = DATA.profile.name + " | Portfolio";
  if (view !== "home") {
    view = "home";
    app.innerHTML = homeView();
    initRoad();
  }
  const target = ["journey", "certs", "contact"].includes(h) ? document.getElementById(h) : null;
  if (target) target.scrollIntoView({ behavior: reduceMotion ? "auto" : "smooth", block: "start" });
  else scrollTo(0, 0);
}
addEventListener("hashchange", route);
$("#foot").innerHTML = `&copy; ${new Date().getFullYear()} ${esc(DATA.profile.name)}`;
route();
</script>
